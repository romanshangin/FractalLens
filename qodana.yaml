version: "1.0"
profile:
  name: qodana.starter
projectJDK: "25"
# Resolve dependencies before importing a fresh Maven project in the container.
bootstrap: bash scripts/prepare-qodana
failureConditions:
  severityThresholds:
    any: 0
# Pin the reviewed analyzer, rather than following a changing image tag.
