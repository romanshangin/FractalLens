version: "1.0"
profile:
  name: qodana.starter
projectJDK: "25"
# Resolve dependencies before importing a fresh Maven project in the container.
bootstrap: bash scripts/prepare-qodana
failureConditions:
  severityThresholds:
    any: 0
# The workflow selects the immutable image using the CLI --image option.
linter: jetbrains/qodana-jvm-community:2026.2
