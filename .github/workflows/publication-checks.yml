name: Publication checks

on:
  pull_request:
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout selected history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test privacy controls and baseline analyzers
        run: |
          PYTHONDONTWRITEBYTECODE=1 bash scripts/ci/run-ci-tests python3 -m unittest discover -s scripts/publication -p 'test_public_privacy.py'
          PYTHONDONTWRITEBYTECODE=1 bash scripts/ci/run-ci-tests python3 -m unittest discover -s scripts/benchmarks -p 'test_summarize_baseline*.py'
      - name: Check tracked publication data
        run: python3 scripts/publication/check_public_data.py
      - name: Install pinned secret scanner
        run: bash scripts/publication/install-gitleaks
      - name: Scan the complete reachable Git history
        run: python3 scripts/publication/check_secrets.py
