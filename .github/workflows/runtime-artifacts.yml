name: Runtime Artifacts

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/runtime-artifacts.yml'
      - 'packaging/**'
      - 'pom.xml'
      - 'scripts/package_runtime.py'
      - 'scripts/test_package_runtime.py'
      - 'scripts/privacy.py'
      - 'scripts/check_public_data.py'
      - 'scripts/run-ci-tests'
      - 'src/main/**'
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload installers only after private destination validation and artifact review
        required: false
        type: boolean
        default: false
      version:
        description: Numeric package version, for example 1.2.3
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: runtime-artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package and smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: python3
          - os: windows-latest
            python: python

    steps:
      - name: Check out clean source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: true
          persist-credentials: false

      - name: Verify clean checkout
        shell: bash
        run: test -z "$(git status --porcelain)"

      - name: Set up Java 25 and Maven cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Locate WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wix = 'C:\Program Files (x86)\WiX Toolset v3.14\bin'
          if (Test-Path $wix) {
            $wix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path (Join-Path $wix 'candle.exe'))) {
            throw 'WiX Toolset 3.14 is required to create the Windows installer.'
          }

      - name: Validate packaging contracts
        shell: bash
        run: bash scripts/run-ci-tests ${{ matrix.python }} scripts/test_package_runtime.py

      - name: Select package version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="$REQUESTED_VERSION"
          if test -z "$version" && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if test -z "$version"; then
            version="1.0.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$version" =~ ^[0-9]+([.][0-9]+)*$ ]]; then
            echo "Package version must be numeric." >&2
            exit 2
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build installer and run packaged launcher smoke test
        shell: bash
        run: >-
          bash scripts/run-ci-tests ${{ matrix.python }} scripts/package_runtime.py
          --version '${{ steps.version.outputs.value }}'

      - name: Check exportable text reports
        if: success()
        shell: bash
        run: >-
          ${{ matrix.python }} scripts/check_public_data.py --files
          target/runtime-package/artifact-provenance.json
          target/runtime-package/smoke-report.properties

      - name: Upload installer, checksum, provenance and smoke report
        if: success() && github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fractallens-runtime-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: |
            target/runtime-package/artifacts/
            target/runtime-package/artifact-provenance.json
            target/runtime-package/smoke-report.properties
          if-no-files-found: warn
          retention-days: 30
