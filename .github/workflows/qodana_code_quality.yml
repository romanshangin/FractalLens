name: Qodana

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qodana:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test report acceptance controls
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts python3 -m unittest discover -s scripts -p 'test_check_qodana.py'
      - name: Community analysis without cloud credentials
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          pr-mode: false
          post-pr-comment: false
          use-annotations: false
          upload-result: false
          use-caches: false
          push-fixes: none
          args: --baseline .qodana/baseline.sarif.json
      - name: Validate complete analysis and export safe findings
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/check_qodana.py
          "${{ runner.temp }}/qodana/results"
          target/qodana-reviewed/results.json
      - name: Check report privacy
        if: ${{ !cancelled() && hashFiles('target/qodana-reviewed/results.json') != '' }}
        run: |
          python3 scripts/check_public_data.py --files target/qodana-reviewed/results.json
          bash scripts/install-gitleaks
          gitleaks dir target/qodana-reviewed --redact=100 --no-banner --ignore-gitleaks-allow --max-decode-depth 5 --max-target-megabytes 0
      - name: Retain only the checked findings report
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qodana-reviewed-findings
          path: target/qodana-reviewed/results.json
          if-no-files-found: error
          retention-days: 7
