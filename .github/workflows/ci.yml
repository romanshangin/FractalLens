name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - "codex/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Validate CI test log wrapper
        shell: bash
        run: bash scripts/test-run-ci-tests

      - name: Run tests
        shell: bash
        run: >-
          bash scripts/run-ci-tests ./mvnw --batch-mode --no-transfer-progress test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-reports-ubuntu-${{ github.run_attempt }}
          path: |
            target/ci-test.log
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 30
