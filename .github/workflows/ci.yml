name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - "codex/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Validate CI test log wrapper
        shell: bash
        run: bash scripts/test-run-ci-tests

      - name: Run tests
        shell: bash
        run: >-
          bash scripts/run-ci-tests ./mvnw --batch-mode --no-transfer-progress test
