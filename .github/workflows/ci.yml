name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "chore/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Validate CI test log wrapper
        shell: bash
        run: bash scripts/ci/test-run-ci-tests

      - name: Run tests
        shell: bash
        run: >-
          bash scripts/ci/run-ci-tests ./mvnw --batch-mode --no-transfer-progress test

  orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Native TypeScript type stripping requires Node.js 24 or later.
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Run task orchestrator tests
        shell: bash
        run: >-
          bash scripts/ci/run-ci-tests node --test
          scripts/orchestration/test_task_orchestrator.ts
          scripts/orchestration/test_validation_evidence.ts
