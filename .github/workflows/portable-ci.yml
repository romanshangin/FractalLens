name: Portable CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CPU-default tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out clean source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: true
          persist-credentials: false

      - name: Verify clean checkout
        shell: bash
        run: test -z "$(git status --porcelain)"

      - name: Set up Java 25 and Maven cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Validate Bash CI test log wrapper
        shell: bash
        run: bash scripts/test-run-ci-tests

      - name: Validate PowerShell CI test log wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-run-ci-tests.ps1

      - name: Run portable CPU-default tests
        shell: bash
        run: >-
          bash scripts/run-ci-tests ./mvnw --batch-mode --no-transfer-progress
          -Dfractal.gpu.enabled=false clean test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surefire-reports-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            target/ci-test.log
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 30
